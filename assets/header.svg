<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Mujeeb Ansari — Full Stack AI Engineer</title>
  <desc id="d">Animated banner: four isometric layers labelled UI, API, AI and Cloud with data packets moving between them.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ecebe4" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="fade" cx="70%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gm"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4d1c"/>
      <stop offset=".5" stop-color="#c58cff"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
    <radialGradient id="glowO" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff4d1c" stop-opacity=".22"/><stop offset="1" stop-color="#ff4d1c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#c58cff" stop-opacity=".18"/><stop offset="1" stop-color="#c58cff" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{fill:none;stroke-width:1.4;stroke-opacity:.5}
    .halo{fill:none;stroke-width:6;opacity:0;filter:url(#blur)}
    .hl{animation:hl 8s infinite}
    .halo.hl{animation:halo 8s infinite}
    @keyframes hl{0%,22%{stroke-opacity:1;stroke-width:2}28%,100%{stroke-opacity:.45;stroke-width:1.4}}
    @keyframes halo{0%,22%{opacity:.9}28%,100%{opacity:0}}
    .phrase{opacity:0;animation:ph 8s infinite}
    @keyframes ph{0%{opacity:0;transform:translateY(8px)}3%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-6px)}}
    .pk{animation:drop 3.2s linear infinite;opacity:0}
    .up{animation:rise 3.6s linear infinite;opacity:0}
    @keyframes drop{0%{transform:translateY(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(168px);opacity:0}}
    @keyframes rise{0%{transform:translateY(168px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(0);opacity:0}}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    /* negative delays: every element is mid-cycle from the first frame */
    .hl.d1,.phrase.d1{animation-delay:0s}
    .hl.d2,.phrase.d2{animation-delay:-6s}
    .hl.d3,.phrase.d3{animation-delay:-4s}
    .hl.d4,.phrase.d4{animation-delay:-2s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.phrase.p1{opacity:1}}
  </style>

  <!-- background -->
  <rect width="1280" height="420" rx="18" fill="#0a0a0b"/>
  <rect width="1280" height="420" rx="18" fill="url(#grid)" mask="url(#gm)"/>
  <circle cx="1000" cy="150" r="260" fill="url(#glowO)"/>
  <circle cx="1060" cy="300" r="220" fill="url(#glowV)"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="18" fill="none" stroke="#ecebe4" stroke-opacity=".08"/>

  <!-- ───────── left: identity ───────── -->
  <g class="mono" font-size="15">
    <text x="64" y="84" fill="#5a5955"><tspan fill="#3ddc97">~/mujeeb100</tspan> <tspan fill="#8b8a84">$</tspan> whoami<tspan class="blink" fill="#ecebe4"> ▍</tspan></text>
  </g>
  <text x="62" y="152" class="sans" font-size="60" font-weight="700" letter-spacing="-2.4" fill="#ecebe4">Mujeeb Ansari</text>
  <text x="64" y="208" class="sans" font-size="38" font-weight="600" letter-spacing="-1.2" fill="#ecebe4">Full Stack <tspan fill="url(#accent)">AI Engineer</tspan></text>

  <!-- rotating phrases, synced with the layer highlight -->
  <g class="mono" font-size="17">
    <text x="64" y="262" fill="#5a5955">▸</text>
    <g transform="translate(86 0)">
      <text class="phrase p1 d1" y="262" fill="#ff4d1c">React &amp; TypeScript interfaces <tspan fill="#5a5955">/ui</tspan></text>
      <text class="phrase d2" y="262" fill="#7c9cff">FastAPI &amp; Django services <tspan fill="#5a5955">/api</tspan></text>
      <text class="phrase d3" y="262" fill="#c58cff">LLM features grounded in real data <tspan fill="#5a5955">/ai</tspan></text>
      <text class="phrase d4" y="262" fill="#3ddc97">Azure &amp; AWS pipelines to production <tspan fill="#5a5955">/cloud</tspan></text>
    </g>
  </g>

  <!-- chips -->
  <g class="mono" font-size="13" fill="#8b8a84">
    <g transform="translate(64 316)">
      <rect width="168" height="34" rx="17" fill="none" stroke="#ecebe4" stroke-opacity=".12"/>
      <circle class="pulse" cx="20" cy="17" r="4" fill="#3ddc97"/>
      <text x="32" y="22">Open to roles</text>
    </g>
    <g transform="translate(244 316)">
      <rect width="96" height="34" rx="17" fill="none" stroke="#ecebe4" stroke-opacity=".12"/>
      <text x="18" y="22"><tspan fill="#ecebe4">6+</tspan> years</text>
    </g>
    <g transform="translate(352 316)">
      <rect width="168" height="34" rx="17" fill="none" stroke="#ecebe4" stroke-opacity=".12"/>
      <text x="18" y="22">Mumbai · Remote</text>
    </g>
  </g>

  <!-- ───────── right: isometric stack ─────────
       local coords u,v ∈ [-50,50] → iso via matrix(k, k/2, -k, k/2, cx, cy), k = 1.5 -->
  <g class="float">
    <!-- L4 cloud (bottom) -->
    <g transform="translate(0 283)">
      <path d="M1000 -75 L1150 0 L1000 75 L850 0Z" fill="#111113" fill-opacity=".92"/>
      <path d="M850 0 L1000 75 L1150 0 L1150 7 L1000 82 L850 7Z" fill="#0d0d0f"/>
      <path class="halo hl d4" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#3ddc97"/>
      <path class="edge hl d4" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#3ddc97"/>
      <g transform="matrix(1.5 .75 -1.5 .75 1000 0)">
        <path d="M-30 0 L30 0" stroke="#3ddc97" stroke-opacity=".6" stroke-width=".8"/>
        <circle cx="-30" cy="0" r="6" fill="#14251e" stroke="#3ddc97" stroke-opacity=".6" stroke-width=".6"/><circle cx="-30" cy="0" r="2.4" fill="#3ddc97"/>
        <circle cx="0" cy="0" r="6" fill="#14251e" stroke="#3ddc97" stroke-opacity=".6" stroke-width=".6"/><circle cx="0" cy="0" r="2.4" fill="#3ddc97"/>
        <circle cx="30" cy="0" r="6" fill="#14251e" stroke="#3ddc97" stroke-opacity=".6" stroke-width=".6"/><circle cx="30" cy="0" r="2.4" fill="#3ddc97"/>
        <rect x="-36" y="-28" width="72" height="8" rx="2" fill="#17201c"/>
        <rect x="-36" y="20" width="72" height="8" rx="2" fill="#17201c"/>
      </g>
      <text x="836" y="4" text-anchor="end" class="mono" font-size="12" fill="#3ddc97">L4 /cloud</text>
    </g>

    <!-- L3 ai -->
    <g transform="translate(0 227)">
      <path d="M1000 -75 L1150 0 L1000 75 L850 0Z" fill="#121214" fill-opacity=".9"/>
      <path d="M850 0 L1000 75 L1150 0 L1150 7 L1000 82 L850 7Z" fill="#0d0d0f"/>
      <path class="halo hl d3" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#c58cff"/>
      <path class="edge hl d3" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#c58cff"/>
      <g transform="matrix(1.5 .75 -1.5 .75 1000 0)" stroke="#c58cff" stroke-opacity=".3" stroke-width=".5">
        <path d="M-25 -16L0 -24M-25 -16L0 -8M-25 -16L0 8M-25 -16L0 24M-25 0L0 -24M-25 0L0 -8M-25 0L0 8M-25 0L0 24M-25 16L0 -24M-25 16L0 -8M-25 16L0 8M-25 16L0 24M0 -24L25 -8M0 -24L25 8M0 -8L25 -8M0 -8L25 8M0 8L25 -8M0 8L25 8M0 24L25 -8M0 24L25 8"/>
        <g fill="#c58cff" stroke="none">
          <circle cx="-25" cy="-16" r="3.2"/><circle cx="-25" cy="0" r="3.2"/><circle cx="-25" cy="16" r="3.2"/>
          <circle cx="0" cy="-24" r="3.2"/><circle cx="0" cy="-8" r="3.2"/><circle cx="0" cy="8" r="3.2"/><circle cx="0" cy="24" r="3.2"/>
          <circle cx="25" cy="-8" r="3.2"/><circle cx="25" cy="8" r="3.2"/>
        </g>
      </g>
      <text x="836" y="4" text-anchor="end" class="mono" font-size="12" fill="#c58cff">L3 /ai</text>
    </g>

    <!-- L2 api -->
    <g transform="translate(0 171)">
      <path d="M1000 -75 L1150 0 L1000 75 L850 0Z" fill="#131315" fill-opacity=".9"/>
      <path d="M850 0 L1000 75 L1150 0 L1150 7 L1000 82 L850 7Z" fill="#0d0d0f"/>
      <path class="halo hl d2" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#7c9cff"/>
      <path class="edge hl d2" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#7c9cff"/>
      <g transform="matrix(1.5 .75 -1.5 .75 1000 0)">
        <rect x="-38" y="-32" width="76" height="11" rx="2" fill="#1f2030"/><rect x="26" y="-29" width="8" height="5" rx="1" fill="#7c9cff"/><rect x="-34" y="-28" width="26" height="2.4" fill="#5a5f80"/>
        <rect x="-38" y="-14" width="76" height="11" rx="2" fill="#1f2030"/><rect x="26" y="-11" width="8" height="5" rx="1" fill="#7c9cff"/><rect x="-34" y="-10" width="32" height="2.4" fill="#5a5f80"/>
        <rect x="-38" y="4" width="76" height="11" rx="2" fill="#1f2030"/><rect x="26" y="7" width="8" height="5" rx="1" fill="#ffcc66"/><rect x="-34" y="8" width="22" height="2.4" fill="#5a5f80"/>
        <rect x="-38" y="22" width="76" height="11" rx="2" fill="#1f2030"/><rect x="26" y="25" width="8" height="5" rx="1" fill="#7c9cff"/><rect x="-34" y="26" width="30" height="2.4" fill="#5a5f80"/>
      </g>
      <text x="836" y="4" text-anchor="end" class="mono" font-size="12" fill="#7c9cff">L2 /api</text>
    </g>

    <!-- L1 ui (top) -->
    <g transform="translate(0 115)">
      <path d="M1000 -75 L1150 0 L1000 75 L850 0Z" fill="#151517" fill-opacity=".92"/>
      <path d="M850 0 L1000 75 L1150 0 L1150 7 L1000 82 L850 7Z" fill="#0d0d0f"/>
      <path class="halo hl d1" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#ff4d1c"/>
      <path class="edge hl d1" d="M1000 -75 L1150 0 L1000 75 L850 0Z" stroke="#ff4d1c"/>
      <g transform="matrix(1.5 .75 -1.5 .75 1000 0)">
        <rect x="-40" y="-40" width="18" height="4" rx="2" fill="#ff4d1c"/>
        <rect x="-16" y="-40" width="10" height="4" rx="2" fill="#ecebe4" fill-opacity=".2"/>
        <rect x="-40" y="-30" width="16" height="66" rx="3" fill="#ecebe4" fill-opacity=".05"/>
        <rect x="-18" y="-30" width="17" height="14" rx="2" fill="#ecebe4" fill-opacity=".07"/>
        <rect x="2" y="-30" width="17" height="14" rx="2" fill="#ecebe4" fill-opacity=".07"/>
        <rect x="22" y="-30" width="17" height="14" rx="2" fill="#ecebe4" fill-opacity=".07"/>
        <rect x="-18" y="-10" width="57" height="46" rx="3" fill="none" stroke="#ecebe4" stroke-opacity=".12" stroke-width=".6"/>
        <g fill="#ff4d1c">
          <rect x="-13" y="20" width="6" height="12"/><rect x="-4" y="12" width="6" height="20"/><rect x="5" y="16" width="6" height="16"/>
          <rect x="14" y="4" width="6" height="28"/><rect x="23" y="10" width="6" height="22"/><rect x="32" y="-2" width="5" height="34"/>
        </g>
      </g>
      <text x="836" y="4" text-anchor="end" class="mono" font-size="12" fill="#ff4d1c">L1 /ui</text>
    </g>

    <!-- packets travelling between layers -->
    <g>
      <circle class="pk" cx="955" cy="118" r="3" fill="#ff4d1c"/>
      <circle class="pk" cx="1040" cy="112" r="3" fill="#7c9cff" style="animation-delay:1.1s"/>
      <circle class="pk" cx="1000" cy="128" r="2.6" fill="#c58cff" style="animation-delay:2.2s"/>
      <circle class="up" cx="1075" cy="120" r="2.8" fill="#3ddc97" style="animation-delay:.5s"/>
      <circle class="up" cx="925" cy="122" r="2.6" fill="#c58cff" style="animation-delay:1.8s"/>
      <circle class="up" cx="1012" cy="104" r="2.4" fill="#ffcc66" style="animation-delay:2.9s"/>
    </g>
  </g>
</svg>
